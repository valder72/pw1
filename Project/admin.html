<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Admin panel</title>
  </head>
  <body>
    <header class="bg-dark text-white p-3 text-center mb-4">
      <h1 style="color: #e74c3c">CyberSec — Адмін панель</h1>
    </header>
    <div class="position-fixed top-0 end-0 p-3">
      <a href="index.html" class="btn btn-outline-light"> На головну </a>
    </div>

    <div class="container my-4">
      <div class="row g-4">
        <div class="col-md-4">
          <form class="admin-form p-4 rounded shadow" id="news-form">
            <h2 class="text-center mb-4" id="form-title">Створити новину</h2>
            <input type="hidden" id="news-id" />
            <div class="mb-3">
              <label for="title" class="form-label">Заголовок</label>
              <input
                type="text"
                class="form-control"
                id="title"
                placeholder="Введіть заголовок"
                required
              />
            </div>
            <div class="mb-3">
              <label for="content" class="form-label">Текст</label>
              <textarea
                class="form-control"
                id="content"
                rows="4"
                placeholder="Введіть текст"
                required
              ></textarea>
            </div>
            <div class="mb-3">
              <label for="image" class="form-label">Зображення</label>
              <input
                type="file"
                class="form-control"
                id="image"
                accept="image/*"
                required
              />
            </div>
            <button type="submit" class="btn btn-danger w-100" id="submit-btn">
              Створити
            </button>
            <button
              type="button"
              class="btn btn-outline-light w-100 mt-2 d-none"
              id="cancel-btn"
            >
              Скасувати
            </button>
          </form>
        </div>
        <div class="col-md-8">
          <h2 class="mb-4">Усі новини</h2>
          <div class="row g-3" id="news-list"></div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-HoA1mHjQZyqL0vM9sHjKZtYl7vZtE5YBujZqJLB"
      crossorigin="anonymous"
    ></script>
    <script src="admin.js"></script>
  </body>
</html>
