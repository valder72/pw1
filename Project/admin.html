<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css"/>
    <title>Admin panel</title>
  </head>
  <body>
    <div
      class="container d-flex justify-content-center align-items-center"
      style="height: 100vh"
    >
      <form
        class="p-5 rounded shadow"
        style="width: 300px; background-color: #f8f9fa"
        id="create-news-form"
      >
        <h2 class="text-center mb-4">Create new</h2>
        <div class="mb-3">
          <label for="title" class="from-label">Title</label>
          <input
            type="text"
            class="title"
            id="title"
            placeholder="Enter title"
            required
          />
        </div>
        <div class="mb-3">
          <label for="content" class="form-label">Content</label>
          <input
            type="text"
            class="form-control"
            id="content"
            placeholder="Enter content"
            required
          />
        </div>
        <div class="mb-3">
          <label for="image" class="form-label">Image</label>
          <input
            type="file"
            class="form-control"
            id="image"
            accept="image/*"
            placeholder="Enter image"
            required
          />
        </div>
        <button type="submit" class="btn btn-primary w-100">Create</button>
      </form>
      <div id="news-list"></div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-HoA1mHjQZyqL0vM9sHjKZtYl7vZtE5YBujZqJLB"
      crossorigin="anonymous"
    ></script>
    <script src="admin.js"></script>
  </body>
</html>
