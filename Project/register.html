<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/style.css" />
    <title>Register</title>
  </head>
  <body>
    <header class="bg-dark text-white p-3 text-center mb-4">
      <h1 style="color: #e74c3c">CyberSec</h1>
    </header>
    <div class="position-fixed top-0 end-0 p-3">
      <a href="index.html" class="btn btn-outline-light"> На головну </a>
    </div>
    <div
      class="container d-flex justify-content-center align-items-center"
      style="height: 80vh"
    >
      <form class="cs-form p-5 rounded shadow" id="register-form">
        <h2 class="text-center mb-4">Register</h2>
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input
            type="text"
            class="form-control"
            id="username"
            placeholder="Enter username"
            minlength="3"
            maxlength="20"
            required
          />
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input
            type="email"
            class="form-control"
            id="email"
            placeholder="Enter email"
            required
          />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            class="form-control"
            id="password"
            placeholder="Enter password"
            minlength="8"
            maxlength="100"
            required
          />
        </div>
        <div id="error-msg" class="alert alert-danger d-none mt-3"></div>
        <button type="submit" class="btn btn-danger w-100">Register</button>
        <div class="mt-3 text-center">
          <p>Already have an account? <a href="login.html">Login here</a></p>
        </div>
      </form>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-HoA1mHjQZyqL0vM9sHjKZtYl7vZtE5YBujZqJLB"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="main/main_register.js"></script>
  </body>
</html>
