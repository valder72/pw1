<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Мій Todo List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="main-container">
      <h1>Мій Todo List</h1>

      <form id="todo-form">
        <input
          type="text"
          id="todo-input"
          placeholder="Що потрібно зробити?"
          required
        />
        <button>Додати</button>
      </form>

      <div class="active-container">
        Активних завдань залишилось: <span id="todo-counter">0</span>
      </div>

      <ul id="todo-list"></ul>
    </div>

    <script src="script.js"></script>
  </body>
</html>
